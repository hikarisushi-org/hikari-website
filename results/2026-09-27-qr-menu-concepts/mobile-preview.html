<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hikari · Mobile preview</title><style>*{box-sizing:border-box}body{margin:0;background:#e8eee9;color:#193e36;font:14px system-ui,sans-serif;display:flex;align-items:center;flex-direction:column;padding:20px 12px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}h1{font-size:16px;margin:0}select,button{font:inherit;background:#fff;border:1px solid #b7cbbb;border-radius:7px;padding:8px;color:inherit;cursor:pointer}.phone{border:7px solid #243c34;border-radius:30px;overflow:hidden;box-shadow:0 18px 45px #193e3622;background:#fff;max-width:100%}iframe{display:block;border:0;width:390px;height:744px;max-width:100%}p{font-size:12px;color:#597064;text-align:center;max-width:420px;line-height:1.5}</style><header><h1>Hikari · Mobile preview</h1><label>Width <select id="size"><option value="375">375 px</option><option value="390" selected>390 px</option><option value="430">430 px</option></select></label><button id="refresh">Refresh menu</button></header><div class="phone"><iframe id="menu" src="continuous.html?v=finishing-polish" title="Interactive Hikari mobile menu"></iframe></div><p>Scroll and tap inside the phone. This previews the layout; Safari browser controls and touch behavior may differ on your iPhone.</p><script>const menu=document.getElementById('menu');document.getElementById('size').onchange=e=>menu.style.width=e.target.value+'px';document.getElementById('refresh').onclick=()=>menu.contentWindow.location.reload();</script></html>

<!--
=============================================================================
  HIKARI — HERO NOTICE BANNER  (reusable temporary announcement)
=============================================================================
  A frosted dark-glass pill with a gold accent + pulsing status dot, designed
  to sit inside the hero over the video background. Use for short-lived
  announcements: lunch closed, holiday hours, one-off events, "back at 4:30",
  etc.

  First used: 2026-06-12 ("Closed for lunch today").
  Latest example: 2026-06-24 ("Closed this week" through Monday, June 29).

  ---------------------------------------------------------------------------
  HOW TO USE
  ---------------------------------------------------------------------------
  1. Paste the <style> block (below) into <head> of index.html, right after
     the stylesheet <link>s.
  2. Paste the MARKUP block as the FIRST child of <div class="hero-content">
     (before <div class="theme-badge">).
  3. Edit the two text lines:
       - .lunch-notice-title  → short gold eyebrow (UPPERCASE, ~3-4 words)
       - .lunch-notice-sub    → the detail line (wrap the key bit in <strong>)
  4. (Optional) Auto-hide: keep the <script> and set the target time. It uses
     a UTC timestamp so it's timezone-proof. Utah is MDT (UTC-6) in summer,
     MST (UTC-7) in winter — convert your local clock to UTC:
       3:00 PM MDT  → Date.UTC(year, monthIndex, day, 21, 0, 0)
       3:00 PM MST  → Date.UTC(year, monthIndex, day, 22, 0, 0)
     monthIndex is 0-based (Jan=0 … Jun=5 … Dec=11).
     To show it indefinitely (no auto-hide), delete the <script> block.

  REMOVAL: delete the <style>, the markup block, and the <script>. All three
  are tagged with "TEMP NOTICE" comments in index.html for easy find/delete.

  The class is named `.lunch-notice` for historical reasons — it's generic;
  reuse as-is for any announcement.
=============================================================================
-->


<!-- ===== STYLE (goes in <head>) ============================================ -->
<style>
  .lunch-notice {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 13px 24px 13px 20px;
    margin-bottom: 28px;
    border-radius: 999px;
    background: rgba(18, 18, 18, 0.55);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(251, 197, 84, 0.45);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    color: #fff;
    animation: lunchNoticeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .lunch-notice-dot {
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--color-gold, #FBC554);
    animation: lunchPulse 2.2s ease-out infinite;
  }
  .lunch-notice-copy {
    display: flex;
    flex-direction: column;
    gap: 1px;
    text-align: left;
    line-height: 1.3;
  }
  .lunch-notice-title {
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-gold, #FBC554);
  }
  .lunch-notice-sub {
    font-weight: 400;
    font-size: 0.95rem;
    color: rgba(255, 255, 255, 0.92);
  }
  .lunch-notice-sub strong { font-weight: 600; color: #fff; }
  @keyframes lunchPulse {
    0%   { box-shadow: 0 0 0 0 rgba(251, 197, 84, 0.6); }
    70%  { box-shadow: 0 0 0 9px rgba(251, 197, 84, 0); }
    100% { box-shadow: 0 0 0 0 rgba(251, 197, 84, 0); }
  }
  @keyframes lunchNoticeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 600px) {
    .lunch-notice { gap: 11px; padding: 11px 18px 11px 15px; margin-bottom: 22px; }
    .lunch-notice-title { font-size: 0.7rem; }
    .lunch-notice-sub { font-size: 0.85rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lunch-notice, .lunch-notice-dot { animation: none; }
  }
</style>


<!-- ===== MARKUP (first child of .hero-content) ============================= -->
<!-- TEMP NOTICE — EDIT THE DATE/REASON. Auto-hides per the <script> below. -->
<div class="lunch-notice" role="status" id="lunch-notice">
  <span class="lunch-notice-dot" aria-hidden="true"></span>
  <span class="lunch-notice-copy">
    <span class="lunch-notice-title">Closed this week</span>
    <span class="lunch-notice-sub">We&rsquo;ll reopen <strong>Monday, June 29</strong> while our team takes a short break.</span>
  </span>
</div>


<!-- ===== SCRIPT (optional auto-hide; place right after the markup) ========= -->
<script>
  // Hide the notice at/after the target time. UTC timestamp = timezone-proof.
  // Example below: 4:30 PM MDT on 2026-06-29  ->  22:30 UTC, month index 5 (Jun).
  (function () {
    var el = document.getElementById('lunch-notice');
    if (el && Date.now() >= Date.UTC(2026, 5, 29, 22, 30, 0)) el.remove();
  })();
</script>
